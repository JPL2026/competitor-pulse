name: Build, Scrape & Deploy

on:
  push:
    branches: [main]
  schedule:
    # 09:00 UTC = 12:00 Amman — daily eShop scrape
    - cron: "0 9 * * *"
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-scrape-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build site
        run: |
          npm install --no-audit --no-fund
          npm run build
          cp dist/index.html dist/404.html  # SPA fallback for GitHub Pages

      - name: Daily ATL eShop scrape → Supabase
        run: node scripts/scrape-atl.mjs
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
